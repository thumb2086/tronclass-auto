name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm test || true

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-gui:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build-flag: --linux
            artifact: tronclass-auto-linux
          - os: windows-latest
            build-flag: --win
            artifact: tronclass-auto-win
          - os: macos-latest
            build-flag: --mac
            artifact: tronclass-auto-mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: gui
        run: npm install

      - name: Build Electron app
        working-directory: gui
        run: npx electron-builder ${{ matrix.build-flag }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            gui/dist/*.exe
            gui/dist/*.dmg
            gui/dist/*.AppImage
            gui/dist/*.yml
          if-no-files-found: warn

  release:
    needs: [build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
